security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_CASHIER: [ ROLE_USER ]
        ROLE_ADMIN: [ ROLE_CASHIER ]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        license_provision:
            pattern: ^/api/license/provision
            security: false

        whatsapp_webhook:
            pattern: ^/api/whatsapp/webhook
            security: false

        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            refresh_jwt:
                check_path: /api/token/refresh
            logout:
                path: api_token_invalidate

        main:
            lazy: true
            provider: app_user_provider
            security: false

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    access_control:
        - { path: ^/api/(login_check|token/refresh), roles: PUBLIC_ACCESS }
        - { path: ^/api/whatsapp/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/license/provision, roles: PUBLIC_ACCESS }
        - { path: ^/api/appointments/book, roles: PUBLIC_ACCESS }
        - { path: ^/api/company/public-list, roles: PUBLIC_ACCESS }
        - { path: ^/api/branch/public-list, roles: PUBLIC_ACCESS }
        - { path: ^/api/barber/public-list, roles: PUBLIC_ACCESS }
        - { path: ^/api/barber/available-list, roles: PUBLIC_ACCESS }
        - { path: ^/api/barber/schedule, roles: PUBLIC_ACCESS }
        - { path: ^/api/category/public-list, roles: PUBLIC_ACCESS }
        - { path: ^/api/service/public-list, roles: PUBLIC_ACCESS }
        - { path: ^/api/review/public-list, roles: PUBLIC_ACCESS }
        - { path: ^/api/review/rate-branch, roles: PUBLIC_ACCESS }
        - { path: ^/api/review/rate-barber, roles: PUBLIC_ACCESS }
        - { path: ^/api/review/submit, roles: PUBLIC_ACCESS }
        - { path: ^/api/reports/sales-details, roles: [ ROLE_CASHIER ] }
        - { path: ^/api/company/all, roles: [ ROLE_CASHIER ] }
        - { path: ^/api/company, roles: [ ROLE_ADMIN ] }
        - { path: ^/api/service_type, roles: [ ROLE_CASHIER ] }
        - { path: ^/api/commission/all, roles: [ ROLE_CASHIER ] }
        - { path: ^/api/commission, roles: [ ROLE_ADMIN ] }
        - { path: ^/api/branch/all, roles: [ ROLE_CASHIER ] }
        - { path: ^/api/branch/\d+/products, roles: [ ROLE_ADMIN ] }
        - { path: ^/api/branch, roles: [ ROLE_ADMIN ] }
        - { path: ^/api/cash_box/all, roles: [ ROLE_CASHIER ] }
        - { path: ^/api/cash_box, roles: [ ROLE_ADMIN ] }
        - { path: ^/api/user/list/barbers, roles: [ ROLE_CASHIER ] }
        - { path: ^/api/user/information, roles: [ ROLE_CASHIER ] }
        - { path: ^/api/user/my-branches, roles: [ ROLE_CASHIER ] }
        - { path: ^/api/user, roles: [ ROLE_ADMIN ] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time.
            # In tests however, secure hashes are not important, waste resources
            # and increase test times.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10