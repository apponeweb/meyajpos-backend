# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    app.license_provision_token: '%env(LICENSE_PROVISION_TOKEN)%'
    app.license_default_password: '%env(LICENSE_DEFAULT_PASSWORD)%'
    app.license_default_role: '%env(LICENSE_DEFAULT_ROLE)%'

    app.whatsapp_verify_token: '%env(WHATSAPP_VERIFY_TOKEN)%'
    app.whatsapp_access_token: '%env(WHATSAPP_ACCESS_TOKEN)%'
    app.whatsapp_phone_number_id: '%env(WHATSAPP_PHONE_NUMBER_ID)%'
    app.whatsapp_business_account_id: '%env(WHATSAPP_BUSINESS_ACCOUNT_ID)%'
    app.openai_api_key: '%env(OPENAI_API_KEY)%'

services:
    # default configuration for services in this file
    _defaults:
        autowire: true
        autoconfigure: true

    libphonenumber\PhoneNumberUtil:
        factory: ['libphonenumber\PhoneNumberUtil', 'getInstance']

    # Makes classes in src/ available to be used as services
    App\:
        resource: '../src/'

    App\EventListener\TenantRequestListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 64 }

    App\EventListener\IgnoreViewSchemaListener:
        tags:
            - { name: doctrine.event_listener, event: postGenerateSchema, connection: default }

    App\EventListener\BranchContextListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 5 }

    App\EventListener\JWTCreatedListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }

    App\Controller\Api\LicenseProvisionController:
        arguments:
            $provisionToken: '%app.license_provision_token%'
            $defaultPassword: '%app.license_default_password%'
            $defaultRole: '%app.license_default_role%'

    App\Controller\Api\WhatsApp\WhatsAppWebhookController:
        arguments:
            $whatsappVerifyToken: '%app.whatsapp_verify_token%'

    App\Service\WhatsApp\WhatsAppClient:
        arguments:
            $whatsappAccessToken: '%app.whatsapp_access_token%'
            $whatsappPhoneNumberId: '%app.whatsapp_phone_number_id%'

    App\Service\WhatsApp\AiResponseService:
        arguments:
            $openAiApiKey: '%app.openai_api_key%'

    App\Service\AI\OpenAIClient:
        arguments:
            $openAiApiKey: '%env(OPENAI_API_KEY)%'
            $openAiModel: '%env(OPENAI_MODEL)%'
            $timeoutSeconds: '%env(int:OPENAI_TIMEOUT_SECONDS)%'

    App\Service\WhatsApp\IntentClassifier:
        arguments:
            $openAiEnabled: '%env(bool:OPENAI_ENABLED)%'
            $minimumAiConfidence: '%env(float:OPENAI_MIN_CONFIDENCE)%'

# Add more service definitions when explicit configuration is needed.
# Last definitions replace previous ones.